# Duix.Avatar web stack: browser front end + API server + rqlite + the upstream GPU services.
#
#   cp .env.example .env      # optional: ports, data dir, image tags
#   docker compose up -d      # first run pulls ghcr.io/dolfly/duix-avatar-* images (tens of GB)
#   open http://<host>:8080
#
# The GPU images come from this repo's GHCR mirror (mirrored from the upstream guiji2025/*
# by .github/workflows/mirror-gpu.yml); only the client layer moved
# from Electron to the browser (ffmpeg.wasm + rqlite + HTTP).
#
# Tags: the GPU images default to `latest`. Pin them in .env when you want reproducibility:
#   TTS_IMAGE=ghcr.io/dolfly/duix-avatar-tts:1.0.43
#   GEN_VIDEO_IMAGE=ghcr.io/dolfly/duix-avatar-gen-video:0.1.0_sdk_slim
#   ASR_IMAGE=ghcr.io/dolfly/duix-avatar-asr:1.0.2
# Note the port numbers used by the desktop docs are NOT tags - those tags do not exist.
#
# Data layout on the host (bind mounted, so it survives container removal):
#   ./data/face2face/temp/   model videos, generated audio, results  -> gen-video:/code/data
#   ./data/voice/data/       voice cloning reference audio          -> tts:/code/data
#   ./data/uploads/          temp uploads (can be pruned safely)
#
# Multiple duix-server replicas may share one rqlite node: tasks are leased with an atomic
# UPDATE, so two instances never pick the same video twice.

services:
  duix-rqlite:
    image: rqlite/rqlite:8.36.2
    container_name: duix-rqlite
    restart: unless-stopped
    # Stable raft identity. The image defaults -node-id to $(hostname), which changes every
    # time the container is recreated; after `docker compose down` + `up` the persisted raft
    # configuration would still hold the old voter id and the node would never become leader
    # (503 leader not found, server crash-loops). Fixed ids and advertised addresses survive
    # recreation, so a restart keeps the same single-node cluster.
    environment:
      NODE_ID: ${RQLITE_NODE_ID:-duix-rqlite}
      HTTP_ADV_ADDR: ${RQLITE_HTTP_ADV_ADDR:-duix-rqlite:4001}
      RAFT_ADV_ADDR: ${RQLITE_RAFT_ADV_ADDR:-duix-rqlite:4002}
    # Only needed by the server; publish it if you want to inspect the database.
    ports:
      - '127.0.0.1:${RQLITE_PORT:-4001}:4001'
    volumes:
      - ${DATA_DIR:-./data}/rqlite:/rqlite/file/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/status?level=none']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    networks:
      - duix_net

  duix-server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    image: duix-avatar-server:${IMAGE_TAG:-latest}
    container_name: duix-server
    restart: unless-stopped
    # The VRAM admission gate runs `nvidia-smi` from the server to check free GPU memory
    # before submitting. The `utility` capability mounts ONLY nvidia-smi + libnvidia-ml
    # (no GPU compute), and NVIDIA_VISIBLE_DEVICES scopes the probe to the same card the
    # GPU containers use. On a host without an nvidia runtime, override GPU_RUNTIME (and
    # set VIDEO_VRAM_CHECK=false) - see doc/web-deployment.md.
    runtime: ${GPU_RUNTIME:-nvidia}
    depends_on:
      duix-rqlite:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '8280'
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RQLITE_URL: http://duix-rqlite:4001
      RQLITE_LEVEL: ${RQLITE_LEVEL:-weak}
      TTS_BASE_URL: ${TTS_BASE_URL:-http://duix-tts:8080}
      FACE2FACE_BASE_URL: ${FACE2FACE_BASE_URL:-http://duix-gen-video:8383/easy}
      # GPU probe visibility (see runtime comment above).
      NVIDIA_VISIBLE_DEVICES: ${GPU_IDS:-0}
      NVIDIA_DRIVER_CAPABILITIES: utility
      # Path prefix the server sends to the TTS service in `reference_audio`. The upstream
      # TTS image prepends its own media_path `/code/data` (config/config.py) to this value,
      # so it must be a leading-slash path RELATIVE to that root. With `/` the server sends
      # `/origin_audio/x.wav` and the image turns it into `/code/data/origin_audio/x.wav`.
      # Do NOT set `/code/data` here: the image double-prefixes it to `/code/data/code/data/...`
      # and every voice clone fails with "file not exists".
      TTS_REMOTE_DATA_ROOT: ${TTS_REMOTE_DATA_ROOT:-/}
      # gen-video consumes the path as-is (no double prefix), so /code/data stays correct.
      FACE2FACE_REMOTE_DATA_ROOT: /code/data
      # Web login (DO-84). duix-server refuses to start without credentials (fail fast).
      # The scrypt hash contains `$` separators that compose would interpolate away, so in
      # .env they must be doubled (`$$`); the hash-generation command in .env.example emits
      # the already-escaped value. AUTH_PASSWORD is the plaintext alternative (hashed at
      # startup, never stored) - prefer AUTH_PASSWORD_HASH.
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      # Optional: address the stack is published on, used only for documentation/links.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-2000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-120000}
      # GPU inference admission gates (DO-120): in-flight cap, total task timeout, and a
      # fail-closed VRAM check before submit. Defaults tuned for a single 8 GiB card.
      VIDEO_MAX_INFLIGHT: ${VIDEO_MAX_INFLIGHT:-1}
      VIDEO_TASK_TIMEOUT_MS: ${VIDEO_TASK_TIMEOUT_MS:-1800000}
      VIDEO_VRAM_CHECK: ${VIDEO_VRAM_CHECK:-true}
      VIDEO_MIN_FREE_VRAM_MB: ${VIDEO_MIN_FREE_VRAM_MB:-2048}
      NVIDIA_SMI_BIN: ${NVIDIA_SMI_BIN:-nvidia-smi}
      VIDEO_VRAM_PROBE_TIMEOUT_MS: ${VIDEO_VRAM_PROBE_TIMEOUT_MS:-5000}
    volumes:
      - ${DATA_DIR:-./data}:/data
    ports:
      - '127.0.0.1:${SERVER_PORT:-8280}:8280'
    networks:
      - duix_net

  duix-web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: duix-avatar-web:${IMAGE_TAG:-latest}
    container_name: duix-web
    restart: unless-stopped
    depends_on:
      - duix-server
    ports:
      - '${WEB_PORT:-8080}:80'
    networks:
      - duix_net

  duix-tts:
    image: ${TTS_IMAGE:-ghcr.io/dolfly/duix-avatar-tts:latest}
    container_name: duix-tts
    restart: unless-stopped
    runtime: ${GPU_RUNTIME:-nvidia}
    working_dir: /code
    # Hard resource ceiling (DO-120): a runaway model must never be able to eat the
    # whole 24 GiB / 8 vCPU host and have the kernel OOM-kill other containers. The
    # mem_limit bounds the container; cpus/pids bound CPU and process count. Tune in .env.
    mem_limit: ${TTS_MEM_LIMIT:-4g}
    cpus: ${TTS_CPUS:-2}
    pids_limit: ${TTS_PIDS_LIMIT:-512}
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_IDS:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    volumes:
      - ${DATA_DIR:-./data}/voice/data:/code/data
      # Override the upstream image's FunASR websocket client: bump rcg.close(timeout=3)
      # to 30s so slower GPUs (e.g. Pascal P4000) don't drop the transcription of 10-16s
      # reference audio. Upstream file is /code/asr_fun.py; re-verify after upgrading the
      # image tag (see deploy/patches/asr_fun.py and doc/web-deployment.md).
      - ./deploy/patches/asr_fun.py:/code/asr_fun.py:ro
    command: /bin/bash -c "/opt/conda/envs/python310/bin/python3 tools/api_server.py --listen 0.0.0.0:8080"
    ports:
      - '127.0.0.1:${TTS_PORT:-18180}:8080'
    networks:
      - duix_net

  duix-gen-video:
    image: ${GEN_VIDEO_IMAGE:-ghcr.io/dolfly/duix-avatar-gen-video:latest}
    container_name: duix-gen-video
    restart: unless-stopped
    runtime: ${GPU_RUNTIME:-nvidia}
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - NVIDIA_VISIBLE_DEVICES=${GPU_IDS:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    volumes:
      - ${DATA_DIR:-./data}/face2face:/code/data
    command: python /code/app_local.py
    shm_size: ${SHM_SIZE:-4g}
    # Hard resource ceiling (DO-120): the single-inference gen-video process is the worst
    # memory hog, but the 24 GiB host also runs toonflow/scenoria/runvm, so it must stay
    # bounded. Tune in .env.
    mem_limit: ${GEN_VIDEO_MEM_LIMIT:-8g}
    cpus: ${GEN_VIDEO_CPUS:-4}
    pids_limit: ${GEN_VIDEO_PIDS_LIMIT:-512}
    ports:
      - '127.0.0.1:${GEN_VIDEO_PORT:-8383}:8383'
    networks:
      - duix_net

  # Upstream's ASR image. Voice cloning (POST /api/models -> TTS /v1/preprocess_and_tran)
  # depends on this service: the TTS image's config.py hardcodes is_local = True and ignores
  # need_asr, so it always dials the FunASR websocket. It therefore starts with the default
  # stack (no profile) and is reachable by the alias below.
  duix-asr:
    image: ${ASR_IMAGE:-ghcr.io/dolfly/duix-avatar-asr:latest}
    container_name: duix-asr
    restart: unless-stopped
    runtime: ${GPU_RUNTIME:-nvidia}
    working_dir: /workspace/FunASR/runtime
    # Hard resource ceiling (DO-120), same rationale as duix-tts / duix-gen-video.
    mem_limit: ${ASR_MEM_LIMIT:-2g}
    cpus: ${ASR_CPUS:-1}
    pids_limit: ${ASR_PIDS_LIMIT:-256}
    environment:
      # Same GPU filtering as duix-tts/duix-gen-video: on multi-GPU hosts pick the card that
      # supports the models; without it the nvidia runtime defaults to all cards.
      - NVIDIA_VISIBLE_DEVICES=${GPU_IDS:-0}
    command: sh /run.sh
    ports:
      - '127.0.0.1:${ASR_PORT:-10095}:10095'
    networks:
      duix_net:
        # The TTS image's config.py hardcodes `fun_asr_host = 'duix-avatar-asr'`, which is
        # not this service's name (`duix-asr`), so register that alias for the TTS -> ASR
        # websocket to resolve.
        aliases:
          - duix-avatar-asr

networks:
  duix_net:
    driver: bridge

volumes: {}