# Duix.Avatar web stack: browser front end + API server + rqlite + the upstream GPU services.
#
#   cp .env.example .env      # optional: ports, data dir
#   docker compose up -d      # first run pulls guiji2025/* images (tens of GB)
#   open http://<host>:8080
#
# The three GPU images are the upstream ones and are unchanged; only the client layer moved
# from Electron to the browser (ffmpeg.wasm + rqlite + HTTP).
#
# Data layout on the host (bind mounted, so it survives container removal):
#   ./data/face2face/temp/   model videos, generated audio, results  -> gen-video:/code/data
#   ./data/voice/data/       voice cloning reference audio          -> tts:/code/data
#   ./data/uploads/          temp uploads (can be pruned safely)
#
# Multiple duix-server replicas may share one rqlite node: tasks are leased with an atomic
# UPDATE, so two instances never pick the same video twice.

services:
  duix-rqlite:
    image: rqlite/rqlite:8.36.2
    container_name: duix-rqlite
    restart: unless-stopped
    # Only needed by the server; publish it if you want to inspect the database.
    ports:
      - '127.0.0.1:${RQLITE_PORT:-4001}:4001'
    volumes:
      - ${DATA_DIR:-./data}/rqlite:/rqlite/file/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/status?level=none']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    networks:
      - duix_net

  duix-server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    image: duix-avatar-server:${IMAGE_TAG:-latest}
    container_name: duix-server
    restart: unless-stopped
    depends_on:
      duix-rqlite:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '8280'
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RQLITE_URL: http://duix-rqlite:4001
      RQLITE_LEVEL: ${RQLITE_LEVEL:-weak}
      TTS_BASE_URL: ${TTS_BASE_URL:-http://duix-tts:8080}
      FACE2FACE_BASE_URL: ${FACE2FACE_BASE_URL:-http://duix-gen-video:8383/easy}
      # Path prefixes the GPU containers see for the same files.
      TTS_REMOTE_DATA_ROOT: /code/data
      FACE2FACE_REMOTE_DATA_ROOT: /code/data
      # Optional: address the stack is published on, used only for documentation/links.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-2000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-120000}
    volumes:
      - ${DATA_DIR:-./data}:/data
    ports:
      - '127.0.0.1:${SERVER_PORT:-8280}:8280'
    networks:
      - duix_net

  duix-web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: duix-avatar-web:${IMAGE_TAG:-latest}
    container_name: duix-web
    restart: unless-stopped
    depends_on:
      - duix-server
    ports:
      - '${WEB_PORT:-8080}:80'
    networks:
      - duix_net

  duix-tts:
    image: ${TTS_IMAGE:-guiji2025/fish-speech-ziming:18180}
    container_name: duix-tts
    restart: unless-stopped
    runtime: ${GPU_RUNTIME:-nvidia}
    working_dir: /code
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_IDS:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    volumes:
      - ${DATA_DIR:-./data}/voice/data:/code/data
    command: /bin/bash -c "/opt/conda/envs/python310/bin/python3 tools/api_server.py --listen 0.0.0.0:8080"
    ports:
      - '127.0.0.1:${TTS_PORT:-18180}:8080'
    networks:
      - duix_net

  duix-gen-video:
    image: ${GEN_VIDEO_IMAGE:-guiji2025/duix.avatar:8383}
    container_name: duix-gen-video
    restart: unless-stopped
    runtime: ${GPU_RUNTIME:-nvidia}
    privileged: true
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - NVIDIA_VISIBLE_DEVICES=${GPU_IDS:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    volumes:
      - ${DATA_DIR:-./data}/face2face:/code/data
    command: python /code/app_local.py
    shm_size: ${SHM_SIZE:-8g}
    ports:
      - '127.0.0.1:${GEN_VIDEO_PORT:-8383}:8383'
    networks:
      - duix_net

  # Upstream's ASR image. This client never calls it (TTS runs with need_asr=false), so it is
  # opt-in and costs no GPU memory by default:
  #   docker compose --profile asr up -d
  duix-asr:
    image: ${ASR_IMAGE:-guiji2025/fun-asr:10095}
    container_name: duix-asr
    restart: unless-stopped
    profiles: ['asr']
    runtime: ${GPU_RUNTIME:-nvidia}
    working_dir: /workspace/FunASR/runtime
    command: sh /run.sh
    ports:
      - '127.0.0.1:${ASR_PORT:-10095}:10095'
    networks:
      - duix_net

networks:
  duix_net:
    driver: bridge

volumes: {}