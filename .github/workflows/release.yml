name: Release

# Tag a release (v1.2.3) to build the Electron installers for all three platforms and
# publish them as a GitHub release. The Docker images are built and pushed by docker.yml,
# which also triggers on tags.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            build: build:win
          - name: macos
            os: macos-latest
            build: build:mac
          - name: linux
            os: ubuntu-latest
            build: build:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build installers
        run: npm run ${{ matrix.build }}
        env:
          # Unsigned builds: never try to auto-discover a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.yml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: publish release
    needs: client
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: client-*

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=$(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name '*.yml' \) | tr '\n' ' ')
          printf 'Release assets:\n%s\n' "$files"
          gh release create "$tag" --title "$tag" --generate-notes --verify-tag $files