<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Duix.Avatar</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- `blob:` is required by the browser build: ffmpeg.wasm loads its core through a
         blob URL and the local media previews use blob/object URLs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * 'self'; script-src * 'self' blob:; style-src * 'self' 'unsafe-inline'; img-src * 'self' data: blob: file:; media-src * 'self' data: blob: file:; connect-src * 'self' blob: data:; worker-src * 'self' blob:;"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
