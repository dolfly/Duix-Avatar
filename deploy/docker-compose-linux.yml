networks:
  ai_network:
    driver: bridge

services:
  duix-avatar-tts:
    image: ghcr.io/dolfly/duix-avatar-tts
    container_name: duix-avatar-tts
    restart: always
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    ports:
      - '18180:8080'
    volumes:
      - ~/duix_avatar_data/voice/data:/code/data
    command: /bin/bash -c "/opt/conda/envs/python310/bin/python3 tools/api_server.py --listen 0.0.0.0:8080"
    networks:
      - ai_network
  duix-avatar-asr:
    image: ghcr.io/dolfly/duix-avatar-asr
    container_name: duix-avatar-asr
    restart: always
    runtime: nvidia
    working_dir: /workspace/FunASR/runtime
    environment:
      # Without privileged, the GPU is selected by NVIDIA_VISIBLE_DEVICES; keep a single
      # explicit card so multi-GPU hosts don't hand the wrong one to FunASR.
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - '10095:10095'
    command: sh /run.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ai_network
  duix-avatar-gen-video:
    image: ghcr.io/dolfly/duix-avatar-gen-video
    container_name: duix-avatar-gen-video
    restart: always
    runtime: nvidia
    volumes:
      - ~/duix_avatar_data/face2face:/code/data
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - NVIDIA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    shm_size: '8g'
    ports:
      - '8383:8383'
    command: python /code/app_local.py
    networks:
      - ai_network
