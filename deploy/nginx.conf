# nginx site config for the Duix.Avatar web front end.
#
# - the renderer is a hash-router SPA: unknown paths fall back to index.html
# - /api is proxied to the server container (large uploads, long-running generations)
# - the vendored ffmpeg.wasm core is ~25MB: served as application/wasm and cached forever
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Video uploads go through /api, so this vhost itself needs no big body limit.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # API: stream request bodies (no buffering) and allow very long generations.
    location /api/ {
        proxy_pass http://duix-server:8280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }

    # ffmpeg.wasm core: correct MIME type matters, and it never changes between builds.
    location ~* ^/ffmpeg/.*\.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/ffmpeg/.*\.js$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Hashed build assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}